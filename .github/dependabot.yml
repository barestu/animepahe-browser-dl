version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
    groups:
      # One PR per concern rather than one per package — this is a small project and
      # every bump has to be verified by hand against a live page anyway.
      dev-dependencies:
        dependency-type: development
      ffmpeg:
        patterns: ['@ffmpeg/*']
