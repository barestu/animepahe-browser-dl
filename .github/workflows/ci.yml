name: CI

on:
  push:
    branches: [main]
  pull_request:

# There is no test framework in this project: this workflow *is* the regression net.
# It proves the extension still type-checks and bundles on a clean machine.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Full install on purpose: sharp (native) is needed by gen:icons and @ffmpeg/core
      # is what copy:ffmpeg copies out of node_modules. Neither survives --prod or
      # --ignore-scripts, and both run inside `pnpm build`.
      - run: pnpm install --frozen-lockfile

      - name: Type-check Svelte components
        run: pnpm check # tsc alone does not check .svelte

      - name: Build extension
        run: pnpm build # includes tsc --noEmit

      - name: Verify dist/ is a loadable extension
        run: |
          test -f dist/manifest.json
          test -d dist/icons
          test -d dist/ffmpeg
          node -e "
            const m = require('./dist/manifest.json');
            const p = require('./package.json');
            if (m.version !== p.version) {
              console.error(\`manifest \${m.version} != package.json \${p.version}\`);
              process.exit(1);
            }
            console.log('manifest.json v' + m.version + ' ok');
          "
